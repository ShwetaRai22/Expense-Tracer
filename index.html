<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="ExpenseTracker.css">
</head>

<body>

    <header>
        <div class="headerIcon">
            <i data-lucide="wallet" class="walletcardIcon"></i>
        </div>
        <div id="headmsg">
            <h1>Expense Tracker</h1>
            <p>Track your spending easily!</p>
        </div>
    </header>

    <main>
        <div class="summaryCard">
            <div id="scard1" class="summary">
                <div class="sideIcon">
                    <i data-lucide="hand-coins" class="dollarIcon"></i>
                </div>
                <label for="totalIncome">Total Income</label>
                <div class="inputBox">
                        <i data-lucide="indian-rupee"></i>
                        <input type="number" id="totalincome" name="totalincome" required>
                    </div>
                
            </div>
            <div id="scard2" class="summary">
                <div class="sideIcon">
                    <i data-lucide="receipt" class="calendarIcon"></i>
                </div>
                <p>Total Expense</p>
                <div class="sinputBox">
                    <i data-lucide="indian-rupee"></i></div>
                    <h4></h4>
                
            </div>
            <div id="scard3" class="summary">
                <div class="sideIcon">
                    <i data-lucide="scale" class="chartIcon"></i>
                </div>
                <p>Remaining Balance</p>
                <div class="sinputBox">
                    <i data-lucide="indian-rupee"></i></div>
                    <h4></h4>
            </div>
        </div>

        <div id="addExpenseCard">
            <h2>Add New Expense</h2>
            <p>Enter the details below to add new expense:</p>

            <form id="expenseForm">

                <div class="formGroup">
                    <label for="description">Description:</label>
                    <div class="inputBox">
                        <i data-lucide="file-text"></i>
                        <input type="text" id="description" name="description" required>
                    </div>
                </div>
                <div class="formGroup">
                    <label for="amount">Amount:</label>
                    <div class="inputBox">
                        <i data-lucide="indian-rupee"></i>
                        <input type="number" id="amount" name="amount" step="0.01" required>
                    </div>
                </div>
                <div class="formGroup">
                    <label for="category">Category:</label>
                    <div class="inputBox">
                        <i data-lucide="tag"></i>
                        <select id="category" name="category" required>
                            <option value="">Select a category</option>
                            <option value="Food">Food</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Education">Education</option>
                            <option value="Transportation">Transportation</option>
                        </select>
                    </div>
                </div>
                <div class="formGroup">
                    <label for="date">Date:</label>
                    <div class="inputBox">
                        <i data-lucide="calendar"></i>
                        <input type="date" id="date" name="date" required>
                    </div>
                </div>
                <button type="submit" id="addbutton">+Add Expense</button>
            </form>
        </div>


        <div class="summaryCard">
            <div id="scard1" class="summary">
                <div class="sideIcon">
                    <i data-lucide="dollar-sign" class="dollarIcon"></i>
                </div>
                <p>Total Spent</p>
                <div class="sinputBox">
                    <i data-lucide="indian-rupee"></i></div>
                    <h4></h4>
                
            </div>
            <div id="scard2" class="summary">
                <div class="sideIcon">
                    <i data-lucide="calendar-days" class="calendarIcon"></i>
                </div>
                <p>This Month</p>
                <div class="sinputBox">
                    <i data-lucide="indian-rupee"></i></div>
                    <h4></h4>
                
            </div>
            <div id="scard3" class="summary">
                <div class="sideIcon">
                    <i data-lucide="chart-column" class="chartIcon"></i>
                </div>
                <p>Average Daily</p>
                <div class="sinputBox">
                    <i data-lucide="indian-rupee"></i></div>
                    <h4></h4>
            </div>
        </div>
        
        <div id="expenseListCard">
            <h2>Your Expense List</h2>
            <p>Here are your recorded expenses:</p>
            <div id="filterRecords">
                <select id="filterCategory" name="filterCategory">
                    <option value="">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Groceries">Groceries</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Transportation">Transportation</option>
                </select>
            </div>
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
    </main>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="ExpenseTracker.js"></script>
</body>

</html>
